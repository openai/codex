name: Copybara Public To Internal

on:
  workflow_dispatch:
    inputs:
      public_ref:
        description: "openai/codex ref or SHA to import"
        required: false
        default: "main"
  push:
    branches:
      - main
  schedule:
    # Offset from common 10-minute boundaries because GitHub may delay or drop
    # scheduled workflows during high-load periods.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: copybara/public-to-internal

concurrency:
  group: copybara-public-to-internal
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'openai/codex-internal' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The import script searches main history for the latest
          # Codex-Public-RevId trailer to find the last imported public commit.
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install Copybara
        id: copybara
        run: .github/internal/install_copybara.sh

      - name: Import public changes
        env:
          COPYBARA_JAR: ${{ steps.copybara.outputs.copybara_jar }}
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.public_ref || 'main' }}
        run: python3 .github/internal/copybara_public_to_internal.py
