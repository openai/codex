name: Copybara Config Check

on:
  pull_request:
    paths:
      - ".copybara/**"
      - ".github/internal/install_copybara.sh"
      - ".github/internal/verify_copybara_config.py"
      - ".github/workflows/copybara-config-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Copybara config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Copybara
        id: copybara
        run: .github/internal/install_copybara.sh

      - name: Validate Copybara config and marker transforms
        env:
          COPYBARA_JAR: ${{ steps.copybara.outputs.copybara_jar }}
        run: python3 .github/internal/verify_copybara_config.py
