name: Codex Internal To Public Staging Check

on:
  pull_request:
    paths:
      - ".github/codex-internal-to-public/**"
      - ".github/workflows/codex-internal-to-public-staging.yml"
      - ".github/workflows/codex-internal-to-public-staging-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test staging pipeline
        run: |
          python3 -m unittest discover \
            -s .github/codex-internal-to-public \
            -p 'test_*.py'
