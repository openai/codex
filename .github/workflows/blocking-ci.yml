name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  # For PRs, cancel the previous CI run when a new commit is pushed.
  # Keep every `main` run so we do not discard post-merge CI.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  # TODO(anp): Remove this freeze once the mirroring pipeline's permissions
  # have been restored.
  public-github-freeze:
    name: Public GitHub Actions freeze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject frozen public GitHub Actions changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          restricted_paths=(
            public/.github/workflows/
            ':(glob)public/**/.github/actions/**'
          )
          if ! git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- "${restricted_paths[@]}"; then
            echo "::error::public GitHub Actions changes are temporarily frozen"
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- "${restricted_paths[@]}"
            exit 1
          fi

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() && !cancelled() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - public-github-freeze
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Enforce the freeze before checking out any PR-controlled helper code.
      - name: Require public GitHub Actions freeze
        if: ${{ needs.public-github-freeze.result != 'success' }}
        run: |
          echo "::error::public GitHub Actions changes are temporarily frozen"
          exit 1

      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
