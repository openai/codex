name: Verify internal PR does not break public CI

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_projection:
    name: Prepare public projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install Copybara
        id: copybara
        run: .github/internal/install_copybara.sh

      - name: Create public projection
        env:
          COPYBARA_JAR: ${{ steps.copybara.outputs.copybara_jar }}
          PUBLIC_PROJECTION: ${{ runner.temp }}/codex-public-projection
        run: |
          set -euo pipefail
          java -jar "${COPYBARA_JAR}" migrate .copybara/copy.bara.sky internal_to_public_projection "${GITHUB_WORKSPACE}" \
            --folder-dir="${PUBLIC_PROJECTION}" \
            --force-author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --force-message="Validate public projection"

      - name: Checkout sanitized public lockfiles
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: copybara-no-internal-references
          persist-credentials: false
          path: public-lockfile-baseline
          sparse-checkout: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
          sparse-checkout-cone-mode: false

      - name: Restore public lockfiles and reconcile Cargo
        working-directory: ${{ runner.temp }}/codex-public-projection
        env:
          PUBLIC_PROJECTION: ${{ runner.temp }}/codex-public-projection
        run: |
          set -euo pipefail

          cp \
            "${GITHUB_WORKSPACE}/public-lockfile-baseline/codex-rs/Cargo.lock" \
            "${PUBLIC_PROJECTION}/codex-rs/Cargo.lock"
          cp \
            "${GITHUB_WORKSPACE}/public-lockfile-baseline/MODULE.bazel.lock" \
            "${PUBLIC_PROJECTION}/MODULE.bazel.lock"

          reject_internal_dependency_references() {
            if rg --line-number --ignore-case \
              --glob Cargo.lock \
              --glob Cargo.toml \
              --glob MODULE.bazel.lock \
              'codex[-_]internal|github\.com/openai/codex-internal' \
              "${PUBLIC_PROJECTION}"; then
              echo "Public dependency metadata contains an internal reference." >&2
              exit 1
            fi
          }

          cargo_metadata=(
            cargo metadata
            --format-version 1
            --manifest-path "${PUBLIC_PROJECTION}/codex-rs/Cargo.toml"
          )

          reject_internal_dependency_references
          "${cargo_metadata[@]}" >/dev/null
          "${cargo_metadata[@]}" --locked >/dev/null
          reject_internal_dependency_references

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: public-projection-bazel-lock

      - name: Reconcile and verify MODULE.bazel.lock
        working-directory: ${{ runner.temp }}/codex-public-projection
        run: |
          bazel mod deps --lockfile_mode=update
          ./scripts/check-module-bazel-lock.sh
          if rg --line-number --ignore-case \
            'codex[-_]internal|github\.com/openai/codex-internal' \
            MODULE.bazel.lock; then
            echo "Public dependency metadata contains an internal reference." >&2
            exit 1
          fi

      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Archive public projection
        env:
          PUBLIC_PROJECTION: ${{ runner.temp }}/codex-public-projection
        run: tar -czf "${RUNNER_TEMP}/public-projection.tgz" -C "${PUBLIC_PROJECTION}" .

      - name: Upload public projection
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: public-projection
          path: ${{ runner.temp }}/public-projection.tgz
          if-no-files-found: error
          retention-days: 1

  bazel:
    name: Public projection Bazel tests
    needs: prepare_projection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: bazel
      deployment: false
    steps:
      # Keep the internal checkout solely for the local Bazel setup action and
      # its cache key. Every command under test runs in the downloaded public
      # projection.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download public projection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-projection
          path: ${{ runner.temp }}/public-projection-artifact

      - name: Extract public projection
        run: |
          mkdir -p "${RUNNER_TEMP}/codex-public-projection"
          tar -xzf "${RUNNER_TEMP}/public-projection-artifact/public-projection.tgz" \
            -C "${RUNNER_TEMP}/codex-public-projection"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: public-projection-bazel-build-test
          install-test-prereqs: "true"

      - name: Verify MODULE.bazel.lock
        working-directory: ${{ runner.temp }}/codex-public-projection
        run: ./scripts/check-module-bazel-lock.sh

      - name: Bazel test //...
        working-directory: ${{ runner.temp }}/codex-public-projection
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            # Keep V8-backed code-mode tests out of the ordinary Linux leg;
            # the public Bazel matrix exercises these on authenticated Windows
            # cross-compiled shards.
            -//codex-rs/code-mode:code-mode-unit-tests
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-public-projection-linux
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

  repo_checks:
    name: Public projection repository checks
    needs: prepare_projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public projection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-projection
          path: ${{ runner.temp }}/public-projection-artifact

      - name: Extract public projection
        run: tar -xzf "${RUNNER_TEMP}/public-projection-artifact/public-projection.tgz" -C "${GITHUB_WORKSPACE}"

      # format.py enumerates the repository through git ls-files. Recreate only
      # the index it needs; the projection artifact deliberately has no source
      # or internal Git history.
      - name: Initialize projected Git index
        run: |
          git init --initial-branch=main
          git add --all --force

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install just
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Check rusty_v8 MODULE.bazel checksums
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md

      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

  node_checks:
    name: Public projection Node and package checks
    needs: prepare_projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Download public projection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-projection
          path: ${{ runner.temp }}/public-projection-artifact

      - name: Extract public projection
        run: tar -xzf "${RUNNER_TEMP}/public-projection-artifact/public-projection.tgz" -C "${GITHUB_WORKSPACE}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage npm package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEX_VERSION=0.133.0-alpha.4
          WORKFLOW_URL="https://github.com/openai/codex/actions/runs/26201494185"
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$CODEX_VERSION" \
            --workflow-url "$WORKFLOW_URL" \
            --package codex \
            --output-dir "$OUTPUT_DIR"

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

  build-test:
    name: Internal to public projection build-test
    needs:
      - bazel
      - repo_checks
      - node_checks
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every public projection check to pass
        env:
          BAZEL_RESULT: ${{ needs.bazel.result }}
          REPO_CHECKS_RESULT: ${{ needs.repo_checks.result }}
          NODE_CHECKS_RESULT: ${{ needs.node_checks.result }}
        run: |
          if [[ "${BAZEL_RESULT}" != success || \
                "${REPO_CHECKS_RESULT}" != success || \
                "${NODE_CHECKS_RESULT}" != success ]]; then
            echo "Bazel: ${BAZEL_RESULT}" >&2
            echo "Repository checks: ${REPO_CHECKS_RESULT}" >&2
            echo "Node checks: ${NODE_CHECKS_RESULT}" >&2
            exit 1
          fi
