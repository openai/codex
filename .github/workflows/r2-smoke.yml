name: r2-smoke

on:
  push:
    branches:
      - zsol/r2-smoke-20260714

permissions: {}

jobs:
  smoke-assets:
    permissions:
      contents: read
    uses: ./.github/workflows/r2-release.yml
    secrets: inherit
    with:
      tag: rust-v0.146.0-alpha.10.1
      make_latest: false
      prerelease: false
      stage: assets

  smoke-finalize:
    needs: smoke-assets
    permissions:
      contents: read
    uses: ./.github/workflows/r2-release.yml
    secrets: inherit
    with:
      tag: rust-v0.146.0-alpha.10.1
      make_latest: false
      prerelease: false
      stage: finalize
